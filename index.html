<!DOCTYPE html>
<!--
NOTAS DEL ARCHIVO (todas las notas van aquí arriba)

1. MARCA: "Hogar Hogareña". Sitio de una inmobiliaria con listado de propiedades en Lima.
   Contacto: cada anuncio usa el WhatsApp que escribió quien lo publicó en el formulario. En el código no hay ningún número fijo; si un anuncio no trae número, su tarjeta no muestra el botón de WhatsApp.

2. COLORES (solo 3, en todo el sitio):
   - Color 1: negro  #1a1a1a  hsl(0, 0%, 10%)    -> fondo y textos sobre verde
   - Color 2: verde  #14eb4a  hsl(135, 84%, 50%) -> acentos, botones, bordes activos
   - Color 3: blanco #e8fded  hsl(135, 84%, 95%) -> textos y contornos
   Los grises/transparencias son el blanco o el verde con opacidad (rgba), no colores nuevos.
   Estilo: modo oscuro.

3. DISEÑO (basado en la captura de referencia):
   - Barra de filtros: Ubicación, Alquilar/Comprar, Departamento (antes "Inmueble"), Precio y Más filtros.
     Los 5 tienen el mismo tamaño y forma squircle, con su ícono pegado a la derecha.
   - Filtros desplegables (Alquilar/Comprar, Departamento, Precio, Más filtros): al hacer clic se abre debajo
     un squircle solo con las opciones (sin título), el ∨ pasa a ∧ y al elegir se cierra. Más filtros tiene solo
     "Sin filtros" y cuatro casillas numéricas (Superficie, Dormitorios, Baños, Estacionamientos); queda abierto mientras se escribe. Al seleccionar un filtro solo cambia el color del borde
     (no hay segundo contorno). Se maneja también con teclado (flechas y Esc).
   - Precio: al abrirlo sale "Cualquier precio" y debajo la moneda (USD primero, Soles a la derecha; por defecto Soles). USD = dólar de Estados Unidos, Soles = sol peruano (PEN). Al cambiar de moneda cambian también todos los precios de la página (tarjetas y mapa) y el rango se convierte con el tipo de cambio TC
     y dos casillas Desde / Hasta. Solo aceptan números. "Cualquier precio" sigue elegido hasta que se escribe un monto y se pulsa "Ver resultados" (el rango no filtra antes). Al hacer clic en una casilla desaparece su texto guía y su
     borde pasa a color 3 (blanco). Si la propiedad está en otra moneda se convierte con el tipo de cambio TC (en el JavaScript).
   - Debajo: cantidad de resultados, botón "Ordenar" y la lista de propiedades.
   - "Ordenar" es un desplegable del mismo estilo que los filtros, con 2 opciones: Menor precio y Mayor precio.
     El texto del botón siempre dice "Ordenar" (no cambia). Por defecto está elegido Mayor precio.
   - Mapa a la derecha: ocupa el alto de la pantalla desde que se abre la página y se queda arriba (no es sticky: no sigue al bajar por la lista).
   - Más filtros: casillas solo con números; 0 es el valor por defecto y significa sin filtro. Con un número se ve 3+ (en Superficie, 60 m² +). Filtra al instante y "Sin filtros" lo vuelve todo a 0. El panel tiene el mismo tamaño que el de Precio.
   - Tarjetas: los datos terminan en punto (m² tot., dorm., baño., estac.). Lo que vale 0 no se muestra.
   - Al pulsar Ver mapa, Ver listado o el logo, la página sube arriba del todo.
   - Separación entre sqcircles: una sola medida, la variable CSS llamada sep en :root (20px). La usan los filtros, la tarjeta de arriba, la barra Ordenar, las tarjetas de la lista y el mapa. Para cambiarla en todo el sitio, se cambia solo ese valor.
   - Línea de la cabecera: el mismo gris de los bordes (blanco al 20%). Las tarjetas ya NO llevan botón de llamada: solo WhatsApp (verde).
   - Tarjeta de arriba (#sel): muestra la propiedad del mapa. Cambia con solo pasar el mouse por un precio
     (o tocarlo), sin necesidad de seleccionarlo; la última queda elegida (pin verde) hasta pasar por otro.
     La página nunca se desplaza por esto: el contenedor conserva su alto para que lo de abajo no se mueva.
     Las tarjetas de abajo (#list) son todo lo que se publica; la de arriba solo es una vista de la elegida.
     Al abrir la página muestra la primera de la lista. Si la elegida queda fuera por los filtros, pasa a
     mostrar la primera que quede.
   - Al pasar el mouse por una tarjeta de abajo se resalta su pin en el mapa.
   - Se quitaron: el botón "Crear alerta", la franja verde de la foto (ej. "Entrega inmediata")
     y la etiqueta "Destacado".

4. MAPA REAL: usa Leaflet (cdnjs) con el mapa estándar de OpenStreetMap (el de colores normales, con calles y nombres; sin clave de API). Es un mapa de todo el mundo, pero con límite: un solo mundo (no se repite ni se sale de los bordes; maxBounds y minZoom se calcula según el tamaño del mapa).
   Vista inicial: Latinoamérica (LATAM). Los precios del mapa se agrupan en círculos con el número de propiedades (clic = acercar).
   Ubicaciones: lista fija País, Estado, Capital con sugerencias al escribir; al elegir una, el mapa va allí y la lista muestra solo lo que hay en esa zona
   (borrar el texto quita la zona). Todos los detalles están en la nota 14.
   "Ver mapa" (abajo del mapa) abre el mapa a todo el ancho con los precios donde está cada propiedad; "Ver listado" vuelve.
   Más filtros: "Sin filtros" va arriba y está marcado por defecto.
   Tarjeta única del mapa (al abrir Ver mapa): mitad imagen y mitad información, sin barra de desplazamiento y sin el texto "Seleccionado en el mapa"; el corazón va arriba a la derecha de la información y, en pantalla ancha, la tarjeta ocupa su propio espacio a la izquierda y el mapa empieza a su derecha (no queda debajo de ella); los botones + y − van abajo a la derecha, encima del texto de OpenStreetMap, con fondo negro y los signos en color 2 (verde); miden 44 px y su centro queda alineado con el de la flecha → de la barra "Ver mapa / Ver listado". El texto "Leaflet | © OpenStreetMap" también va en color 2. Siempre se ven igual: no cambian al pasar el mouse, pulsarlos ni al llegar al límite del zoom.
   Necesita internet para cargar el mapa.
   Cada propiedad lleva sus coordenadas `lat` y `lng`; de ahí salen los pines con precio.
   El mapa de OpenStreetMap es gratis para uso liviano (reglas: operations.osmfoundation.org/policies/tiles); si la web tiene mucho tráfico conviene cambiar de proveedor.
   El estilo claro de CARTO (Voyager) que se probó pide clave de API y salía con marca de agua "API KEY REQUIRED"; por eso no se usa.
   Se puede mirar todo el mundo en el mapa, pero PUBLICAR solo se permite en los 22 países de la nota 14 (ver nota 15).

5. PROPIEDADES: están en la lista `props` del JavaScript final. Los datos son de ejemplo; reemplázalos por los reales.
   Cada una usa su imagen (depto1.webp, casa1.webp, terreno1.webp, etc.). Sin imagen se ve un recuadro de aviso.
   Los filtros funcionan con esos datos (tipo, alquiler/venta, precio máximo y ubicación).
   Más filtros solo usa superficie (m2), dorm, ban y est (estacionamientos); el est de cada propiedad es de ejemplo, reemplázalo por el real.

6. SECCIONES ANTERIORES: la versión anterior tenía 3 secciones (captar propietarios, conseguir
   compradores, conseguir inquilinos) dentro de una página de venta. Esta versión las reemplaza
   por el listado de propiedades.

7. TIPO DE CAMBIO (soles por dólar): línea 515, `const TC`. REDONDEO (a dólares hacia arriba, a soles hacia abajo; los 2 en la misma función): línea 516, `const redondear`; lo usan los precios y el rango de Precio.

8. MONEDA POR DEFECTO (por ahora Soles): línea 550, `const estado`, campo `mon:'PEN'`. Es el que manda: 'PEN' = Soles, 'USD' = dólares. Para cambiar el default, cambia solo ese valor.
   Además, en el HTML del panel Precio (líneas 399 y 400) el botón con `aria-selected="true"` solo marca la opción inicial; muévelo al botón de la moneda que quede por defecto (USD línea 399, Soles línea 400).
9. PUBLICAR (Supabase): el botón "Publicar" de la cabecera abre un formulario. Las fotos van a Supabase Storage (bucket "fotos") y los datos a la tabla
   "propiedades" con estado "pendiente"; la página solo muestra las que tienen estado "aprobada" (las cargas al abrir, junto a las de ejemplo de `props`).
   Para aprobar: Supabase > Table Editor > propiedades > cambia estado a "aprobada" (o "rechazada"). El contacto del anuncio es el WhatsApp que escribió quien publica.
   Conexión: pega la dirección del proyecto en `SB_URL` y la clave pública en `SB_KEY` (línea 526, cerca del inicio del JavaScript). Antes, corre supabase-completo.sql en el SQL Editor.
   Sin esas dos constantes el sitio funciona igual con los datos de ejemplo y el formulario avisa que falta conectar.
   La dirección se ubica con Nominatim (OpenStreetMap); si no la encuentra, usa el centro de la zona (revisa lat/lng en la tabla al aprobar).
   Los textos de los anuncios se escapan antes de mostrarse (esc), así nadie puede inyectar código desde el formulario.
10. EJEMPLOS, PROYECTOS Y GALERÍA: todas las propiedades de ejemplo dicen solo "Ejemplo" en su descripción y usan precios redondos en soles (100, 1,000, 10,000, 100,000 y 1,000,000).
   Quedan 2 departamentos en alquiler y 1 en venta, más una tarjeta de Proyecto por cada tipo que puede serlo (Departamento, Casa, Terreno y Oficina; lista `PROY` en el JavaScript).
   Cada tarjeta tiene 3 fotos con flechas < > y 3 puntos. La primera es `img`; las otras dos se buscan solas con -2 y -3 en el nombre (depto1.webp, depto1-2.webp, depto1-3.webp)
   en la misma carpeta; si falta alguna se ve el recuadro de aviso con el nombre del archivo que falta. Los anuncios que llegan de Supabase usan las 3 fotos que subió quien publica.
   Formulario Publicar: 3 operaciones (En alquiler, En venta, Proyecto; con Proyecto el tipo solo ofrece los 4 permitidos), el monto se separa con comas cada 3 dígitos (1,000),
   y el teléfono tiene selector con todos los países de América en orden alfabético (Perú +51 por defecto). Supabase acepta Proyecto con supabase-completo.sql.
11. TECLA 1: pone la página en pantalla completa (modo F11) y, al pulsarla otra vez, sale (Esc también sale). No hace nada si hay un desplegable abierto (Alquilar, Departamento, Precio, Más filtros, Ordenar),
   si están las sugerencias de Ubicación, si la ventana Publicar está abierta o si se está escribiendo en una casilla. El código está al final del JavaScript.
12. SUPABASE: supabase-completo.sql crea y deja todo listo (tabla, reglas de seguridad y bucket "fotos" de 500 KB por archivo, solo JPG) y se puede correr varias veces.
13. ANTIBOT: el formulario envía todo a la función "publicar" (funcion-publicar.ts), que verifica Turnstile (Cloudflare) y guarda las fotos y el anuncio. Pasos: pegar la Site Key en TS_SITEKEY, crear la función en Supabase con el secreto TURNSTILE_SECRET_KEY y, cuando ya funcione, correr supabase-cerrar-escritura.sql para que nadie pueda escribir directo. La página ya reduce cada foto a menos de 500 KB antes de subirla.
14. UBICACIONES (casilla de búsqueda "País, Estado, Ciudad"):
   - El texto gris "País, Estado, Ciudad" es solo de ejemplo: desaparece al escribir la primera letra.
   - La lista es FIJA y está en el JavaScript (constante `DATOS`, en el bloque "Ubicaciones"). Las sugerencias no usan internet: salen al instante.
   - Cada opción es siempre "País, Estado, Capital del estado" (ej.: Perú, Junín, Huancayo). Nunca sale solo el país ni "País, Estado".
   - Lo que se escribe se compara con el INICIO de esa frase (sin importar tildes ni mayúsculas). Si escribes un país, solo salen opciones de ese país.
     Escribir "Huancayo" solo no encuentra nada: hay que empezar por el país (Perú, Junín, Huancayo). También sirve "perú,junín".
   - Orden alfabético por país, luego estado, luego capital. Máximo 5 opciones (constante `MAX`). Sin barra de desplazamiento; la lista mide lo mismo que la casilla.
   - PAÍSES INCLUIDOS (22): United States, Canada, México, Belice, Guatemala, Honduras, El Salvador, Nicaragua, Costa Rica, Panamá, Puerto Rico,
     República Dominicana, Argentina, Bolivia, Brasil, Chile, Colombia, Ecuador, Paraguay, Perú, Uruguay y Venezuela.
   - NO ESTÁN, a propósito: Guyana, Surinam, Guayana Francesa y las islas del Caribe, salvo Puerto Rico y República Dominicana
     (Cuba, Haití, Jamaica, Bahamas, Barbados, Trinidad y Tobago, Antigua y Barbuda, Dominica, Granada, San Cristóbal y Nieves, Santa Lucía, San Vicente,
     Curazao, Aruba, Guadalupe y Martinica). Belice sí está porque es de Centroamérica (continente).
   - IDIOMA: todo en español, salvo los países donde el inglés es lengua nativa (United States, Canada y Belize), que se muestran en inglés con sus estados
     en inglés. Esos tres también se encuentran escribiendo en español (Estados Unidos, Canadá, Belice) gracias a `ALIAS`.
   - PERÚ lleva TODAS las capitales de provincia de sus 25 departamentos (196; ej.: Junín = Huancayo, Concepción, La Merced, Jauja, Junín, Satipo, Tarma, La Oroya, Chupaca).
     Los demás países llevan solo la capital de cada estado (una por estado). Pendiente: darles también las capitales de provincia/condado.
   - La lista fue escrita de memoria (618 combinaciones): si algo sale mal escrito o falta, se corrige en `DATOS`.
     Para agregar un país hay que tocar 3 cosas: `DATOS` (estados y capitales), `PAIS` (nombre que se muestra) y `CAJA` (zona del país [sur, oeste, norte, este]);
     y `ALIAS` solo si es de habla inglesa. Para quitar un país, se borra de esas mismas constantes.
   - AL ELEGIR una opción: el mapa va a esa capital y la lista de propiedades se filtra a esa zona. La ubicación exacta se pide a Photon (OpenStreetMap, sin clave);
     si no responde en 4 segundos, el mapa queda en el país. Borrar el texto quita la zona.
   - El formulario Publicar no usa los estados ni las capitales, pero sí la lista de países (nota 15).
15. PUBLICAR SOLO EN LOS PAÍSES ELEGIDOS: el mapa es de todo el mundo, pero el formulario Publicar solo deja enviar si la dirección queda en uno de los 22 países de la nota 14
   (como en Urbania, que solo deja publicar en Perú). Al enviar, la dirección se ubica con Nominatim (`addressdetails=1`) y se revisa su país contra `HH_PAISES`
   (se arma solo con las claves de `DATOS`). Si no coincide, avisa con la lista de países permitidos y no envía nada.
   Esta revisión está solo en la página: para que un robot tampoco pueda saltársela, la función "publicar" de Supabase (funcion-publicar.ts) debería revisar el país de lat/lng igual.
   Mientras tanto, nada se muestra sin que lo apruebes tú (estado "aprobada").
16. CONTORNO DE LA CAPITAL: al elegir una opción de Ubicación, además de ir allí, el mapa dibuja el borde de esa capital (línea color 2 y relleno muy suave). El límite se pide a Nominatim (OpenStreetMap, `polygon_geojson`) en la función `limite`; al llegar, el mapa se encuadra a ese borde y la lista se filtra por su área. Si Nominatim no responde en 6 segundos o solo devuelve un punto, no se dibuja nada y todo sigue como antes. Borrar el texto de Ubicación quita el borde.
   PINES Y GRUPOS DEL MAPA: fondo color 2 y texto color 1. Al elegir un pin (o pasar el mouse por un pin o un círculo de grupo) el fondo sigue en color 2 y el texto pasa a color 3.
17. TARJETA VACÍA EN VER MAPA: en pantalla ancha, al abrir Ver mapa la tarjeta de la izquierda siempre ocupa su espacio (el mapa empieza a su derecha). Si no hay propiedades (por la zona o los filtros) queda vacía: fondo color 1 y solo el aviso "No hay propiedades con estos filtros." centrado. En celular, donde la tarjeta taparía el mapa, no se muestra cuando está vacía.
18. ESTADOS UNIDOS COMO "US": tanto en la lista de sugerencias como en la casilla al elegir, Estados Unidos aparece como "US, Estado, Capital" (el texto sale de `label` en `FILAS`). Se encuentra escribiendo US, United States o Estados Unidos; para el orden alfabético se sigue usando "United States" (`ord`), así que escribir "U" muestra primero sus opciones.
-->

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{
  --sep:20px; /* separación única entre sqcircles (filtros, tarjetas, mapa, Ordenar) */
  --negro:#1a1a1a; --verde:#14eb4a; --blanco:#e8fded;
  --linea:rgba(232,253,237,.2); --suave:rgba(232,253,237,.66); --verde-t:rgba(20,235,74,.14);
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Instrument Sans',system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-behavior:smooth;scrollbar-gutter:stable} /* reserva siempre el lugar de la barra: al ir a Ver mapa (sin barra) nada se mueve a los lados */
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--negro);color:var(--blanco);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--verde);outline-offset:3px}
.wrap{width:calc((100% + min(1320px,100% - 48px)) / 2);margin-inline:auto} /* margen lateral = la mitad del anterior */

/* cabecera */
.top{border-bottom:1px solid var(--linea)} /* mismo gris de las demás líneas (bordes de filtros y tarjetas) */
.top .wrap{padding-block:var(--sep);display:flex;align-items:center;justify-content:space-between;gap:var(--sep)} /* mismo espacio (sep) arriba y abajo del logo */
.logo{display:flex;align-items:center;gap:14.4px;height:24.864px;font:800 28.8px/24.864px var(--display);letter-spacing:-.03em} /* x1.5 de icono y texto; el alto del contenedor (24.864px) NO cambia: lo que crece se desborda hacia arriba y abajo dentro del espacio (sep) de la cabecera, así la cabecera mide lo mismo */ /* x0.8; line-height = alto del ícono, así el espacio de arriba y abajo es exactamente sep */
.logo svg{width:46.368px;height:37.296px;flex:none} /* 30.912 x 24.864 por 1.5 */ /* x1.2 del anterior (25.76 x 20.72) */

/* filtros: Ubicación ocupa el espacio que sobra; los otros 4 miden lo mismo (0.8 del ancho que tenían), ícono a la derecha */
.filters{position:relative;z-index:5;display:grid;grid-template-columns:minmax(0,1fr) repeat(4,calc(min(1272px,100% - 72px) * .16));gap:var(--sep);margin:var(--sep) 0 var(--sep)}
.f{position:relative}
.dd{position:relative}
.dd.open{z-index:60}
.sq{display:block;width:100%;height:36px;margin:0;padding:0 52px 0 20px;text-align:left;cursor:pointer;
  background:var(--negro);color:var(--blanco);border:1px solid var(--linea);border-radius:20px;corner-shape:squircle;
  font:600 16px var(--body);appearance:none;-webkit-appearance:none;transition:border-color .2s}
/* al seleccionar solo cambia el color del borde, sin segundo contorno */
.sq,.sq:focus,.sq:focus-visible{outline:none}
.sq:hover,.sq:focus-visible,input.sq:focus,.dd.open .sq,.dd.open .ob{border-color:var(--verde)}
.sq::placeholder{color:var(--suave);opacity:1}
.sq .lbl{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.f>svg{position:absolute;right:18px;top:50%;translate:0 -50%;width:20px;height:20px;pointer-events:none}
.chev{transition:rotate .2s}
.f.open .chev{rotate:180deg}
/* lista de opciones: squircle debajo del filtro */
.panel{position:absolute;top:calc(100% + 8px);left:0;z-index:60;min-width:100%;width:max-content;max-width:min(340px,calc(100vw - 48px));padding:8px;
  display:grid;gap:2px;background:var(--negro);border:1px solid var(--linea);border-radius:22px;corner-shape:squircle;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.9);opacity:0;visibility:hidden;translate:0 -6px;transition:opacity .15s,translate .15s,visibility .15s}
.dd.open .panel{opacity:1;visibility:visible;translate:0 0}
.dd-orden .panel{left:auto;right:0;min-width:100%}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:0;border-radius:14px;corner-shape:squircle;background:none;
  color:var(--blanco);font:500 16px var(--body);text-align:left;white-space:nowrap;cursor:pointer}
.opt:hover,.opt:focus-visible{background:rgba(232,253,237,.08);outline:none}
.radio,.check{flex:none;display:grid;place-items:center;width:24px;height:24px;border:2px solid var(--blanco)}
.radio{border-radius:50%}
.check{border-radius:50%}
.opt[aria-selected="true"] .radio{border-color:var(--verde)}
.opt[aria-selected="true"] .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--verde)}
.opt[aria-selected="true"] .check{border-color:var(--verde)}
.opt[aria-selected="true"] .check::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--verde)}
/* panel de Precio: moneda (USD / Soles) y casillas Desde / Hasta */
#dd-precio .panel{min-width:280px;max-width:none;width:calc(200% + 12px)} /* llega hasta el borde derecho de Más filtros (2 columnas + el espacio entre ellas) */
#dd-mas .panel{left:auto;right:0;min-width:280px;max-width:none;width:calc(200% + 12px)} /* mismo tamaño que el de Precio */
#dd-precio .opt,#dd-precio .mo,#dd-mas .opt{gap:18px} /* más aire entre el círculo y el texto; "USD" queda alineado con "Cualquier precio" */
#dd-tipo .panel{max-height:calc(100vh - 110px);overflow-y:auto;overscroll-behavior:contain} /* salen todos los tipos; solo en pantallas muy bajas aparece scroll */
.mons{display:flex;gap:22px;padding:10px 14px 6px}
.mo{display:flex;align-items:center;gap:14px;padding:0;border:0;background:none;color:var(--blanco);font:500 16px var(--body);cursor:pointer}
.mo[aria-selected="true"] .radio{border-color:var(--verde)}

/* pantalla ancha, vista inicial: se ven justo 2 tarjetas (la de arriba + la primera de la lista) y su borde de abajo queda a sep del fondo de la pantalla;
   el mapa termina en esa misma línea.
   arriba de las tarjetas: cabecera (2*sep + 24.864 + 1) + filtros (2*sep + 36) = 4*sep + 61.864
   2 tarjetas + barra Ordenar (36, igual que los filtros) + 3*sep (entre tarjeta y barra, barra y tarjeta, y el de abajo) = 100vh - 4*sep - 61.864
   => alto de tarjeta = (100vh - 7*sep - 97.864) / 2 ; alto del mapa = 100vh - 5*sep - 61.864 */
@media(min-width:1001px){
  /* Ordenar empieza donde empieza el filtro Departamento y llega hasta el borde derecho de las tarjetas: mismo ancho que una columna de filtros */
  main.wrap{container-type:inline-size}
  .dd-orden{width:calc(min(1272px, 100cqw - 72px) * .16)}
  .dd-orden .ob{width:100%;justify-content:space-between}
  .card{min-height:calc((100vh - 7 * var(--sep) - 97.864px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) / 2);min-height:calc((100dvh - 7 * var(--sep) - 97.864px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) / 2)}
  .map{height:calc(100vh - 5 * var(--sep) - 61.864px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - 5 * var(--sep) - 61.864px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:360px}
}
/* mapa a todo el ancho (Ver mapa) */
button.vm{width:100%;background:none;border:0;border-top:1px solid var(--linea);color:inherit;font:700 16px var(--body);cursor:pointer;text-align:left}
.layout.mg{grid-template-columns:1fr}
html.mg-on,html.mg-on body{overflow:hidden} /* Ver mapa: sin barra de desplazamiento (el lugar de la barra sigue reservado por scrollbar-gutter, así nada se mueve) */
.layout.mg>section{display:none}
.layout.mg .map{position:relative;top:0;height:calc(100vh - 190px);min-height:360px;scroll-margin-top:20px}
/* Ver mapa en pantalla ancha: el mapa llena el alto que queda hasta abajo, dejando sep debajo, y la página no necesita barra de desplazamiento.
   alto = pantalla - (cabecera: sep + 24.864 + sep + 1 de línea) - (filtros: sep + 36 + sep) - sep de abajo = 100vh - 5*sep - 62px */
@media(min-width:1001px){
  .layout.mg{padding-bottom:var(--sep)}
  .layout.mg .map{height:calc(100vh - 5 * var(--sep) - 61.864px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - 5 * var(--sep) - 61.864px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
}

      <div class="sug" id="sug" hidden></div>
    </div>
    <div class="f dd" id="dd-op">
      <button class="sq" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Alquilar o comprar"><span class="lbl"></span></button>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>

      <div class="panel" role="listbox" aria-label="Tipo de propiedad"></div>

      <div class="panel" role="listbox" aria-label="Más filtros" aria-multiselectable="true"></div>

  <div class="layout">

        <div class="btns">
          <div class="dd dd-orden" id="dd-orden">
            <button class="ob" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="lbl">Ordenar</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4v16M4 16l4 4 4-4M16 20V4M12 8l4-4 4 4"/></svg></button>
            <div class="panel" role="listbox" aria-label="Ordenar"></div>

    <aside class="map" aria-label="Mapa de propiedades">

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script>
const LATAM=[[-56,-135],[58,-34]]; // vista inicial: América (el nombre LATAM se conserva por el resto del código)
const props=[]; // sin ejemplos: solo se muestran los anuncios aprobados en Supabase
// cada propiedad tiene 3 fotos: la primera es `img`; las otras dos se buscan como nombre-2.webp y nombre-3.webp en la misma carpeta (ej.: depto1.webp, depto1-2.webp, depto1-3.webp)
props.forEach(p=>{const b=p.img.replace(/\.webp$/,'');p.imgs=[p.img,b+'-2.webp',b+'-3.webp']});
const plural={Departamento:'departamentos',Casa:'casas',Terreno:'terrenos','Local comercial':'locales comerciales',Oficina:'oficinas',Cochera:'cocheras','Local industrial':'locales industriales'};
const TC=3.33;
const redondear=(v,aMoneda)=>aMoneda==='USD'?Math.ceil(v-1e-9):Math.floor(v+1e-9);
const I={
 heart:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/></svg>',
 wa:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.9 2.100c.1.200.1.400 0 .600l-.4.600c-.2.200-.3.400-.1.700.2.300.8 1.300 1.800 2.100 1.200 1 2.200 1.300 2.500 1.500.3.100.5.100.7-.1l.9-1.100c.2-.3.400-.2.700-.1l2 1c.3.100.5.200.6.300.1.200.1.800-.1 1.500z"/></svg>'
};
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString('en-US');
const corto=n=>n>=1e6?+(n/1e6).toFixed(2)+'M':n>=1e3?+(n/1e3).toFixed(n<1e4?1:0)+'K':String(n);
const num=n=>{n=String(n||'');return /^54[1-8]\d{9}$/.test(n)?'549'+n.slice(2):n}; // Argentina: el celular lleva un 9 después del 54 (54 + 10 dígitos pasa a 54 9 + 10 dígitos)
const wa=(t,n)=>'https://wa.me/'+num(n)+'?text='+encodeURIComponent(t);
/* ===== Supabase: anuncios que publica la gente (ver nota 9 y el archivo supabase-completo.sql) ===== */
const SB_URL='https://gjvmpvzekigveggbsyfe.supabase.co';  // ej.: 'https://abcdefgh.supabase.co'  (Project Settings > API > Project URL)
const SB_KEY='sb_publishable_VWav2M1QSUNaS2xfOZYcbw_L40bNwuA';  // clave pública: 'anon' (empieza con eyJ...) o 'publishable' (empieza con sb_publishable_...)
const TS_SITEKEY='0x4AAAAAAF1dJ-ubBRbB5FMW';  // Cloudflare > Turnstile > tu widget > Site Key (es pública)
const FN_URL=SB_URL+'/functions/v1/publicar';  // función de Supabase que verifica Turnstile y guarda el anuncio
const PROY=['Departamento','Casa','Terreno','Oficina']; // tipos que pueden ser Proyecto
const FL={prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>'};
const fotosDe=p=>p.imgs&&p.imgs.length?p.imgs:[p.img];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sbH=(extra)=>Object.assign({apikey:SB_KEY},SB_KEY.startsWith('eyJ')?{Authorization:'Bearer '+SB_KEY}:{},extra||{});
// una fila de la tabla propiedades -> el mismo formato que usa la lista props (id desde 100000 para no chocar con los de ejemplo)
function aProp(r){
  if(!plural[r.tipo]||(r.op!=='alquiler'&&r.op!=='venta'&&r.op!=='proyecto')||(r.op==='proyecto'&&!PROY.includes(r.tipo))||!isFinite(r.lat)||!isFinite(r.lng))return null;
  const f=(Array.isArray(r.fotos)?r.fotos:[]).filter(u=>typeof u==='string'&&u.startsWith(SB_URL+'/storage/'));
  return {id:100000+r.id,img:f[0]||'',imgs:f.length?f:undefined,op:r.op,tipo:r.tipo,precio:+r.precio||0,mon:r.mon==='US$'?'US$':'S/',m2:+r.m2||0,dorm:+r.dorm||0,ban:+r.ban||0,est:+r.est||0,
    dir:String(r.dir||''),zona:String(r.zona||''),am:[],desc:String(r.descr||''),tel:String(r.tel||'').replace(/\D/g,''),lat:+r.lat,lng:+r.lng};
}
async function cargarPublicadas(){
  if(!SB_URL||!SB_KEY)return;
  try{
    const r=await fetch(SB_URL+'/rest/v1/propiedades?select=*&estado=eq.aprobada&order=creado.desc&limit=500',{headers:sbH()});
    if(!r.ok)throw new Error(r.status);
    const filas=(await r.json()).map(aProp).filter(Boolean);
    if(filas.length){props.push(...filas);render()}
  }catch(e){console.warn('No se pudieron cargar los anuncios publicados',e)}
}
const estado={op:'alquiler',tipo:'Departamento',mon:'PEN',desde:0,hasta:0,zona:null,zonaNombre:'',mf:{sup:0,dorm:0,ban:0,est:0},orden:-1}; // orden: -1 = mayor precio (por defecto), 1 = menor precio
let fav=new Set(), mapa=null, capa=null, marcas={}, visibles=[], selId=null;

/* mapa real: Leaflet + mapa estándar de OpenStreetMap (colores normales, calles y nombres), todo el mundo */
function iniciarMapa(){
  if(!window.L)return;
  mapa=L.map('mapa',{zoomSnap:.25,minZoom:2,zoomControl:false,maxBounds:[[-85,-180],[85,180]],maxBoundsViscosity:1,dragging:!L.Browser.mobile});
  mapa.fitBounds(LATAM,{animate:false});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,noWrap:true,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(mapa);
  capa=L.layerGroup().addTo(mapa);
  mapa.on('zoomend',()=>pintar(visibles));
  L.control.zoom({position:'bottomright',zoomInTitle:'Acercar',zoomOutTitle:'Alejar'}).addTo(mapa); // se agrega después de la atribución, así queda encima
  // límite: no se puede alejar más de lo que cabe un solo mundo (sin bordes vacíos ni mundos repetidos)
  const ajustar=()=>{const t=mapa.getSize();if(!t.x||!t.y)return;const z=mapa.getBoundsZoom(L.latLngBounds([[-85,-180],[85,180]]),true);if(isFinite(z))mapa.setMinZoom(Math.max(1,z))};
  mapa.on('resize',ajustar);
  if(window.ResizeObserver)new ResizeObserver(()=>mapa.invalidateSize()).observe(mapa.getContainer()); // si cambia el tamaño del mapa (ej.: aparece la tarjeta) se reacomoda solo
  setTimeout(()=>{mapa.invalidateSize();ajustar()},0);
  addEventListener('resize',()=>{mapa.invalidateSize();$('#sel').style.minHeight=''});
}
function pintar(r){
  if(!mapa)return;
  capa.clearLayers();marcas={};
  // se agrupan las propiedades que quedan a menos de 64 px entre sí (desde el zoom 17 ya no se agrupa)
  const z=mapa.getZoom(),grupos={};
  r.forEach(p=>{
    const pt=mapa.project([p.lat,p.lng],z),k=z>=17?p.id:Math.floor(pt.x/96)+':'+Math.floor(pt.y/60);
    (grupos[k]=grupos[k]||[]).push(p);
  });
  Object.values(grupos).forEach(g=>{
    if(g.length>1){
      const b=L.latLngBounds(g.map(p=>[p.lat,p.lng]));
      L.marker(b.getCenter(),{keyboard:false,icon:L.divIcon({className:'pinwrap',iconSize:[0,0],html:`<span class="grupo">${g.length}</span>`})})
        .addTo(capa).on('click',()=>mapa.fitBounds(b,{padding:[70,70],maxZoom:17}));
      return;
    }
    const p=g[0];
    const m=L.marker([p.lat,p.lng],{keyboard:false,icon:L.divIcon({className:'pinwrap',iconSize:[0,0],html:`<span class="pin">${monSim()} ${corto(pv(p))}</span>`})}).addTo(capa);
    const pin=m.getElement().querySelector('.pin');
    if(p.id===selId)pin.classList.add('sel');
    // al pasar el mouse (o tocar) un precio, la tarjeta de arriba cambia a esa propiedad; la página no se mueve
    pin.addEventListener('pointerenter',()=>elegir(p.id));
    m.on('click',()=>elegir(p.id));
    marcas[p.id]=m;
  });
}
function resaltar(id,on){
  const m=marcas[id];if(!m)return;
  const el=m.getElement();if(el&&el.querySelector('.pin'))el.querySelector('.pin').classList.toggle('on',on);
  m.setZIndexOffset(on?1000:0);
}

/* tarjeta de arriba: la propiedad elegida en el mapa */
function elegir(id){
  if(id===selId)return;
  selId=id;
  Object.keys(marcas).forEach(k=>{const el=marcas[k].getElement().querySelector('.pin');if(el)el.classList.toggle('sel',+k===id)});
  mostrarSel(true);
}
function mostrarSel(animar){
  const box=$('#sel'),p=visibles.find(x=>x.id===selId);
  box.hidden=!p;
  const mc=$('#mcard'),grande=$('.layout').classList.contains('mg');
  mc.hidden=!grande;mc.classList.toggle('vacia',grande&&!p); // en Ver mapa la tarjeta siempre ocupa su lugar; si no hay propiedades queda vacía
  mc.innerHTML=grande?(p?cardHTML(p,true,true):'<div class="card sin">No hay propiedades con estos filtros.</div>'):'';
  box.innerHTML=p?cardHTML(p,true):'';
  if(p&&animar)box.firstElementChild.classList.add('cambia');
  // el contenedor conserva el alto mayor visto, así la lista de abajo no se mueve al cambiar de propiedad
  box.style.minHeight=p?Math.max(parseFloat(box.style.minHeight)||0,box.offsetHeight)+'px':'';
}

const cardHTML=(p,top,sinNota)=>`
    <article class="card${top?' top':''}" data-pid="${p.id}"${top?'':` data-id="${p.id}"`}>
      <div class="pic">
        <div class="pics">${fotosDe(p).map((u,i)=>`<div class="sl"><div class="ph"><span>IMAGEN: ${esc(u)}</span></div><img src="${esc(u)}" alt="${esc(p.tipo)} en ${esc(p.zona)}, foto ${i+1}" loading="lazy" onload="this.previousElementSibling&&this.previousElementSibling.remove()" onerror="this.remove()"></div>`).join('')}</div>
        ${fotosDe(p).length>1?`<button class="pn prev" type="button" aria-label="Foto anterior">${FL.prev}</button><button class="pn next" type="button" aria-label="Foto siguiente">${FL.next}</button><div class="dots">${fotosDe(p).map((_,i)=>`<button class="dot" type="button" aria-label="Ver foto ${i+1}" aria-current="${i===0}"></button>`).join('')}</div>`:''}
      </div>
      <div class="body">
        <button class="heart" type="button" aria-label="Guardar en favoritos" aria-pressed="${fav.has(p.id)}">${I.heart}</button>
        <div class="prow"><p class="price">${precioTxt(p)}</p>${top&&!sinNota?'<p class="selnota">Seleccionado en el mapa</p>':''}</div>
        <div class="spec"><span>${p.m2} m² tot.</span>${p.dorm>0?`<span>${p.dorm} dorm.</span>`:''}${p.ban>0?`<span>${p.ban} ${p.ban===1?'baño.':'baños.'}</span>`:''}${p.est>0?`<span>${p.est} estac.</span>`:''}</div>
        <p class="addr">${esc(p.dir)}</p>
        <p class="zona">${esc(p.zona)}</p>
        <p class="desc">${esc(p.desc)}</p>
        <div class="foot">
          <div class="acts">
            ${p.tel?`<a class="wa" href="${wa(`Hola, me interesa el ${p.tipo.toLowerCase()} en ${p.op}: ${p.dir}, ${p.zona}`,p.tel)}" target="_blank" rel="noopener">WhatsApp ${I.wa}</a>`:''}
          </div>
        </div>
      </div>
    </article>`;

// precio de la propiedad expresado en la moneda elegida (USD o PEN)
const valorEn=(p,m)=>{const usd=p.mon==='US$';return m==='USD'?(usd?p.precio:p.precio/TC):(usd?p.precio*TC:p.precio)};
// precio mostrado en la moneda elegida en Precio (Soles o USD): lo usan las tarjetas, el mapa y el rango
const monSim=()=>estado.mon==='USD'?'US$':'S/';
const pv=p=>redondear(valorEn(p,estado.mon),estado.mon);
const precioTxt=p=>`${monSim()} ${fmt(pv(p))}`;
function render(){
  const {op,tipo,desde,hasta,mon,mf}=estado, zona=estado.zona;
  const r=props.filter(p=>p.op===op&&p.tipo===tipo&&(!desde||valorEn(p,mon)>=desde)&&(!hasta||valorEn(p,mon)<=hasta)&&(!zona||zona.contains([p.lat,p.lng]))&&p.m2>=mf.sup&&(p.dorm||0)>=mf.dorm&&(p.ban||0)>=mf.ban&&(p.est||0)>=mf.est);
  r.sort((a,b)=>(a.precio-b.precio)*estado.orden);
  visibles=r;
  if(!r.some(x=>x.id===selId))selId=r.length?r[0].id:null;
  const may=t=>t.charAt(0).toUpperCase()+t.slice(1); // primera letra de cada elemento elegido en mayúscula
  const nom=may(r.length===1?tipo:plural[tipo]);
  $('#titulo').textContent=`${r.length} ${nom} en ${may(op)} en ${zona?may(estado.zonaNombre||'esta zona'):'América'}`;
  $('#list').innerHTML=r.length?r.map(p=>cardHTML(p,false)).join(''):
    `<div class="vacio">No hay propiedades con estos filtros.</div>`;
  pintar(r);
  mostrarSel(false);
}

/* filtros desplegables: se abren debajo, el ∨ pasa a ∧ y las opciones salen en un squircle */
const DD={
  op:{opts:()=>[['Alquilar','alquiler'],['Comprar','venta'],['Proyectos','proyecto']]},
  tipo:{opts:()=>[['Departamento','Departamento'],['Casa','Casa'],['Terreno','Terreno'],['Oficina','Oficina'],['Local comercial','Local comercial'],['Local industrial','Local industrial'],['Cochera | Garaje','Cochera']].filter(o=>estado.op!=='proyecto'||PROY.includes(o[1]))}, // con Proyecto solo salen Departamento, Casa, Terreno y Oficina
  orden:{fijo:true,opts:()=>[['Mayor precio',-1],['Menor precio',1]]} // el texto "Ordenar" no cambia
};
function dibujar(k){
  const d=DD[k],box=$('#dd-'+k),opts=d.opts();
  const on=v=>estado[k]===v;
  box.querySelector('.panel').innerHTML=opts.map(([t,v],i)=>`<button class="opt" type="button" role="option" aria-selected="${on(v)}" data-i="${i}"><span class="radio"></span>${t}</button>`).join('');
  if(d.fijo)return;
  const l=box.querySelector('.lbl');
  l.textContent=opts.find(o=>o[1]===estado[k])[0];
}
const btn=f=>f.querySelector(':scope > button');
function cerrar(){document.querySelectorAll('.dd.open').forEach(f=>{f.classList.remove('open');btn(f).setAttribute('aria-expanded','false')})}
function alternar(k){
  const f=$('#dd-'+k),abrir=!f.classList.contains('open');
  cerrar();
  if(abrir){f.classList.add('open');btn(f).setAttribute('aria-expanded','true')}
}
Object.keys(DD).forEach(k=>{
  dibujar(k);
  const f=$('#dd-'+k);
  btn(f).addEventListener('click',()=>alternar(k));
  f.querySelector('.panel').addEventListener('click',e=>{
    const b=e.target.closest('.opt');if(!b)return;
    const v=DD[k].opts()[+b.dataset.i][1];
    estado[k]=v;
    if(k==='op'){if(v==='proyecto'&&!PROY.includes(estado.tipo))estado.tipo='Departamento';dibujar('tipo')}
    dibujar(k);
    cerrar();btn(f).focus();
    render();
  });
  f.addEventListener('keydown',e=>{
    if(e.key==='Escape'){cerrar();btn(f).focus();return}
    if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;
    e.preventDefault();
    if(!f.classList.contains('open'))alternar(k);
    const o=[...f.querySelectorAll('.opt')],i=o.indexOf(document.activeElement);
    o[e.key==='ArrowDown'?Math.min(i+1,o.length-1):Math.max(i-1,0)].focus();
  });
});
/* Más filtros: Sin filtros + Superficie, Dormitorios, Baños y Estacionamientos (solo números; 0 = sin filtro; con número se ve 3+ / 60 m² +) */
(function(){
  const f=$('#dd-mas'),panel=f.querySelector('.panel'),lbl=f.querySelector('.lbl');
  const CAMPOS=[['sup','Superficie','m² +'],['dorm','Dormitorios','+'],['ban','Baños','+'],['est','Estacionamientos','+']];
  panel.removeAttribute('aria-multiselectable');
  panel.innerHTML='<button class="opt" type="button" id="mf-ninguno" role="option" aria-selected="true"><span class="check"></span>Sin filtros</button>'+
    CAMPOS.map(([k,t,suf])=>`<div class="mfrow"><label for="mf-${k}">${t}</label><div class="nf" data-k="${k}"><input id="mf-${k}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" value="0" autocomplete="off"><span class="suf">${suf}</span></div></div>`).join('');
  const ning=$('#mf-ninguno');
  function pintarCampo(k){
    const nf=panel.querySelector(`.nf[data-k="${k}"]`),inp=nf.querySelector('input');
    nf.classList.toggle('on',estado.mf[k]>0);
    inp.style.width=Math.max(1,inp.value.length)+'ch';
  }
  function actualizar(){
    const n=CAMPOS.filter(([k])=>estado.mf[k]>0).length;
    lbl.textContent='Más filtros'+(n?` (${n})`:'');
    ning.setAttribute('aria-selected',n===0);
    CAMPOS.forEach(([k])=>pintarCampo(k));
  }
  btn(f).addEventListener('click',()=>alternar('mas'));
  f.addEventListener('keydown',e=>{if(e.key==='Escape'){cerrar();btn(f).focus()}});
  ning.addEventListener('click',()=>{
    CAMPOS.forEach(([k])=>{estado.mf[k]=0;panel.querySelector('#mf-'+k).value='0'});
    actualizar();render();
  });
  CAMPOS.forEach(([k])=>{
    const inp=panel.querySelector('#mf-'+k),nf=inp.parentElement;
    nf.addEventListener('click',()=>inp.focus());
    inp.addEventListener('focus',()=>inp.select());
    // solo números: se bloquea cualquier otro carácter al escribir y se limpia al pegar
    inp.addEventListener('beforeinput',e=>{if(e.data&&/\D/.test(e.data))e.preventDefault()});
    inp.addEventListener('input',()=>{
      inp.value=inp.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'');
      estado.mf[k]=+inp.value||0;   // vacío o 0 = sin filtro
      actualizar();render();
    });
    inp.addEventListener('blur',()=>{if(!inp.value)inp.value='0';actualizar()});
  });
  actualizar();
})();
/* Precio: "Cualquier precio" queda elegido siempre, salvo que se escriba un monto y se pulse "Ver resultados" */
(function(){
  const f=$('#dd-precio'),desde=$('#p-desde'),hasta=$('#p-hasta'),any=$('#p-any'),ver=$('#p-ver'),lbl=f.querySelector('.lbl');
  let monB=estado.mon; // moneda marcada en el panel (se aplica al pulsar "Ver resultados")
  const sim=()=>monB==='USD'?'US$':'S/';
  function actualizar(){
    // el botón muestra lo que se escribe: S/ 1+  /  S/ 1 - S/ 5  /  Hasta S/ 5
    const d=+desde.value||0,h=+hasta.value||0,s=sim();
    lbl.textContent=d&&h?`${s} ${fmt(d)} - ${s} ${fmt(h)}`:d?`${s} ${fmt(d)}+`:h?`Hasta ${s} ${fmt(h)}`:'Precio';
    any.setAttribute('aria-selected',!estado.desde&&!estado.hasta);
    f.querySelectorAll('.mo').forEach(b=>b.setAttribute('aria-selected',b.dataset.m===monB));
  }
  // al abrir, el panel vuelve a mostrar lo que está aplicado (lo escrito sin pulsar "Ver resultados" se descarta)
  function sincronizar(){
    monB=estado.mon;desde.value=estado.desde||'';hasta.value=estado.hasta||'';actualizar();
  }
  btn(f).addEventListener('click',()=>{if(!f.classList.contains('open'))sincronizar();alternar('precio')});
  any.addEventListener('click',()=>{
    estado.desde=estado.hasta=0;sincronizar();cerrar();btn(f).focus();render();
  });
  // la moneda se aplica al instante: cambian los precios de toda la página y el rango (aplicado o escrito) se convierte con TC
  f.querySelectorAll('.mo').forEach(b=>b.addEventListener('click',()=>{
    const nueva=b.dataset.m;if(nueva===monB)return;
    const k=nueva==='USD'?1/TC:TC,cv=n=>n?Math.max(1,redondear(n*k,nueva)):0;
    if(desde.value)desde.value=String(cv(+desde.value));
    if(hasta.value)hasta.value=String(cv(+hasta.value));
    estado.desde=cv(estado.desde);estado.hasta=cv(estado.hasta);
    monB=estado.mon=nueva;actualizar();render();
  }));
  [desde,hasta].forEach(el=>{
    // solo números: se bloquea cualquier otro carácter al escribir y se limpia al pegar
    el.addEventListener('beforeinput',e=>{if(e.data&&/\D/.test(e.data))e.preventDefault()});
    el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'');actualizar()});
    el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ver.click()}});
  });
  ver.addEventListener('click',()=>{
    const d=+desde.value||0,h=+hasta.value||0;
    if(d||h){estado.desde=d;estado.hasta=h;estado.mon=monB}  // solo se aplica si se puso algún monto
    else{estado.desde=estado.hasta=0}                         // sin montos: sigue "Cualquier precio"
    sincronizar();cerrar();btn(f).focus();render();
  });
  f.addEventListener('keydown',e=>{
    if(e.key==='Escape'){cerrar();btn(f).focus()}
    else if(e.key==='ArrowDown'&&e.target===btn(f)){e.preventDefault();if(!f.classList.contains('open')){sincronizar();alternar('precio')}desde.focus()}
  });
  // si se cierra sin pulsar "Ver resultados", el botón vuelve a mostrar lo que está aplicado
  new MutationObserver(()=>{if(!f.classList.contains('open'))sincronizar()}).observe(f,{attributes:true,attributeFilter:['class']});
  sincronizar();
})();
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))cerrar()});

      const pos=el.selectionStart,antes=el.value.slice(0,pos).replace(/\D/g,'').length;
      const d=el.value.replace(/\D/g,'').slice(0,typeof max==='function'?max():max);
      const out=sep===','?d.replace(/\B(?=(\d{3})+(?!\d))/g,','):d.replace(/(\d{3})(?=\d)/g,'$1 ');
      el.value=out;
      let c=0,n=0;while(c<out.length&&n<antes){if(/\d/.test(out[c]))n++;c++}
      try{el.setSelectionRange(c,c)}catch(_){}
    });
  }
  masc(f.elements.precio,',',9);
  masc(f.elements.tel,' ',()=>(LONG[f.elements.pais.value]||[7,11])[1]); // no deja escribir más dígitos de los que usa el país elegido
  f.elements.pais.addEventListener('change',()=>f.elements.tel.dispatchEvent(new Event('input')));
  // tipos: con Proyecto solo Departamento, Casa, Terreno y Oficina
  const TIPOS=['Departamento','Casa','Terreno','Oficina','Local comercial','Local industrial','Cochera'];
  function pintarTipos(){
    const s=f.elements.tipo,act=s.value,l=f.elements.op.value==='proyecto'?PROY:TIPOS;
    s.innerHTML=l.map(t=>`<option value="${t}">${t}</option>`).join('');
    if(l.includes(act))s.value=act;
  }
  f.querySelectorAll('input[name="op"]').forEach(r=>r.addEventListener('change',pintarTipos));
  pintarTipos();
  const say=t=>{msg.textContent=t};
  // Turnstile (Cloudflare): prueba de que quien envía es una persona. La función de Supabase la verifica; el token sirve una sola vez.
  let tsId=null,tsToken=null;
  const montarTS=(n=0)=>{
    if(tsId!==null||TS_SITEKEY.startsWith('PEGA'))return;
    if(!window.turnstile){if(n<50)setTimeout(()=>montarTS(n+1),200);return}
    tsId=turnstile.render('#pf-ts',{sitekey:TS_SITEKEY,theme:'dark',language:'es',appearance:'always',
      callback:t=>{tsToken=t;say('')},'expired-callback':()=>{tsToken=null},'error-callback':c=>{tsToken=null;console.warn('Turnstile error',c);say('Cloudflare no pudo verificar (código '+c+'). Recarga la página e inténtalo de nuevo.')}});
  };
  const nuevoTS=()=>{tsToken=null;if(tsId!==null&&window.turnstile)turnstile.reset(tsId)};
  const esperarTS=async()=>{for(let i=0;i<75&&!tsToken;i++)await new Promise(r=>setTimeout(r,200));return tsToken};
  $('#pub').addEventListener('click',()=>{say('');dlg.showModal();montarTS()});
  $('#pf-x').addEventListener('click',()=>dlg.close());
  dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()}); // clic en el fondo oscuro
  f.querySelectorAll('.dig').forEach(el=>{
    el.addEventListener('beforeinput',e=>{if(e.data&&/\D/.test(e.data))e.preventDefault()});
    el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'')});
  });
  // fotos: se reducen a 1280 px y JPG antes de subir; si aún pesan más de 500 KB se baja la calidad y luego el tamaño (el bucket de Supabase solo acepta hasta 500 KB, ver supabase-completo.sql)
  const MAX_ORIG=15*1024*1024, MAX_SUBIDA=500*1024;
  async function comprimir(file){
    if(file.size>MAX_ORIG)throw new Error('grande');
    const bmp=await createImageBitmap(file);
    let k=Math.min(1,1280/Math.max(bmp.width,bmp.height));
    for(let vuelta=0;vuelta<4;vuelta++){
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*k));c.height=Math.max(1,Math.round(bmp.height*k));
      const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height); // fondo blanco: los PNG con transparencia no salen negros
      for(const q of [.82,.7,.6,.5]){
        const b=await new Promise(ok=>c.toBlob(ok,'image/jpeg',q));
        if(b&&b.size<=MAX_SUBIDA)return b;
      }
      k*=.75;
    }
    throw new Error('pesada');
  }
  // 3 casillas fijas: la primera es la portada
  function pintarFotos(){
    caja.replaceChildren();
    for(let i=0;i<MAX;i++){
      const s=document.createElement('div');s.className='pf-s';
      const x=fotos[i];
      if(x){
        const d=document.createElement('div');d.className='pf-th';
        const im=document.createElement('img');im.src=x.url;im.alt='Foto '+(i+1);
        const b=document.createElement('button');b.type='button';b.textContent='×';b.setAttribute('aria-label','Quitar foto '+(i+1));
        b.addEventListener('click',()=>{URL.revokeObjectURL(x.url);fotos.splice(i,1);pintarFotos()});
        d.append(im,b);s.append(d);
      }else{
        const a=document.createElement('button');a.type='button';a.className='pf-add';a.textContent='+';a.setAttribute('aria-label','Agregar foto '+(i+1));
        a.addEventListener('click',()=>file.click());s.append(a);
      }
      const c=document.createElement('span');c.textContent=i===0?'Portada':'Foto '+(i+1);s.append(c);
      caja.append(s);
    }
  }
  file.addEventListener('change',async()=>{
    const nuevas=[...file.files].filter(x=>x.type==='image/jpeg').slice(0,MAX-fotos.length);
    file.value='';
    for(const x of nuevas){
      try{const b=await comprimir(x);fotos.push({blob:b,url:URL.createObjectURL(b)})}
      catch(e){say(e.message==='grande'?'Una foto pesa más de 15 MB. Elige otra más liviana.':'No se pudo leer una de las fotos. Prueba con otra foto en JPG.')}
    }
    pintarFotos();
  });
  pintarFotos();
  const geo=async q=>{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&accept-language=es&q='+encodeURIComponent(q));
    if(!r.ok)throw new Error(r.status);
    const l=await r.json();return l[0]?{lat:+l[0].lat,lng:+l[0].lon,cc:((l[0].address||{}).country_code||'').toUpperCase()}:null;
  };
  f.addEventListener('submit',async e=>{
    e.preventDefault();
    const v=n=>f.elements[n].value.trim();
    if(v('web'))return;                                   // campo trampa: solo lo llenan los robots
    const bad=(n,t)=>{say(t);f.elements[n].focus();return true};
    const precio=+v('precio').replace(/\D/g,''),m2=+v('m2'),dir=v('dir'),zona=v('zona');
    const cod=f.elements.pais.value,lim=LONG[cod]||[7,11],loc0=v('tel').replace(/\D/g,'').replace(/^0+/,''),loc=(cod==='54'&&loc0.length===11&&loc0[0]==='9')?loc0.slice(1):loc0,tel=cod+loc;
    if(!(precio>0))return bad('precio','Escribe el precio.');
    if(!(m2>0))return bad('m2','Escribe la superficie en m².');
    if(zona.length<3)return bad('zona','Escribe la zona (distrito y ciudad).');
    if(dir.length<5)return bad('dir','Escribe la dirección.');
    if(cod==='54'?loc.length!==10:(loc.length<lim[0]||loc.length>lim[1]))return bad('tel',cod==='54'?'Argentina usa 10 dígitos, sin el 9.':'Ese país usa '+(lim[0]===lim[1]?lim[0]:lim[0]+' u '+lim[1])+' dígitos.');
    if(fotos.length<MAX){say('Agrega las 3 fotos.');const a=caja.querySelector('.pf-add');if(a)a.focus();return}
    if(!SB_URL||!SB_KEY){say('El envío aún no está conectado: falta pegar SB_URL y SB_KEY en el código (nota 9).');return}
    if(TS_SITEKEY.startsWith('PEGA')){say('Falta pegar la Site Key de Turnstile en el código (nota 13).');return}
    try{ if(Date.now()-(+localStorage.getItem('hh_ult')||0)<60000){say('Espera un minuto antes de enviar otro anuncio.');return} }catch(_){}
    send.disabled=true;
    try{
      say('Ubicando la dirección…');
      let pos=null;
      try{pos=await geo(dir+', '+zona)||await geo(zona)}catch(_){}
      if(!pos){say('No pudimos ubicar esa dirección en el mapa. Revisa la zona.');send.disabled=false;return}
      if(window.HH_PAISES&&!HH_PAISES[pos.cc]){say('Por ahora solo se puede publicar en: '+Object.values(HH_PAISES).sort((x,y)=>x.localeCompare(y,'es')).join(', ')+'. Revisa la zona o escribe el país.');send.disabled=false;return}
      say('Verificando…');
      const token=await esperarTS();
      if(!token){say('No pudimos verificar que eres una persona. Recarga la página e inténtalo de nuevo.');nuevoTS();send.disabled=false;return}
      say('Enviando anuncio y fotos…');
      const fd=new FormData();
      fd.append('token',token);
      fd.append('web',v('web'));
      fd.append('datos',JSON.stringify({op:f.elements.op.value,tipo:v('tipo'),precio,mon:f.elements.mon.value,m2,
        dorm:+v('dorm')||0,ban:+v('ban')||0,est:+v('est')||0,dir,zona,descr:v('descr'),tel,lat:pos.lat,lng:pos.lng}));
      fotos.forEach((x,i)=>fd.append('foto'+(i+1),x.blob,(i+1)+'.jpg'));
      const r=await fetch(FN_URL,{method:'POST',headers:sbH(),body:fd});
      nuevoTS(); // el token se usa una sola vez
      if(!r.ok){
        const j=await r.json().catch(()=>({}));
        if(j.error==='captcha'){say('No pudimos verificar que eres una persona. Inténtalo de nuevo.');send.disabled=false;return}
        throw new Error('funcion '+r.status+' '+(j.error||''));
      }
      try{localStorage.setItem('hh_ult',String(Date.now()))}catch(_){}
      f.reset();pintarTipos();fotos.forEach(x=>URL.revokeObjectURL(x.url));fotos=[];pintarFotos();
      say('¡Listo! Recibimos tu anuncio. Se mostrará cuando lo aprobemos.');
    }catch(err){console.error(err);say('No se pudo enviar. Revisa tu conexión e inténtalo de nuevo.')}
    send.disabled=false;
  });
})();
/* galería de las tarjetas: flechas < > y 3 puntos para ver las 3 fotos */
(function(){
  const idx=t=>Math.round(t.scrollLeft/Math.max(1,t.clientWidth));
  function marcar(t){const i=idx(t);t.closest('.pic').querySelectorAll('.dot').forEach((d,k)=>d.setAttribute('aria-current',k===i))}
  function ir(t,i){const n=t.children.length;t.scrollTo({left:((i%n)+n)%n*t.clientWidth,behavior:'smooth'})}
  document.addEventListener('click',e=>{
    const b=e.target.closest('.pn,.dot');if(!b)return;
    const pic=b.closest('.pic'),t=pic.querySelector('.pics');
    if(b.classList.contains('dot'))ir(t,[...pic.querySelectorAll('.dot')].indexOf(b));
    else ir(t,idx(t)+(b.classList.contains('next')?1:-1));
  });
  document.addEventListener('scroll',e=>{const t=e.target;if(t.classList&&t.classList.contains('pics'))marcar(t)},true);
})();
/* tecla 1: pone toda la página en pantalla completa (modo F11) y, al pulsarla otra vez, sale.
   Solo funciona cuando no hay nada abierto: ni un desplegable (Alquilar, Departamento, Precio, Más filtros, Ordenar), ni las sugerencias de Ubicación,
   ni la ventana Publicar, ni se está escribiendo en una casilla. Esc también sale de la pantalla completa (lo hace el navegador). */
document.addEventListener('keydown',e=>{
  if(e.key!=='1'||e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.shiftKey||e.defaultPrevented)return;
  const a=document.activeElement;
  if(a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable))return; // escribiendo
  if(document.querySelector('.dd.open'))return;                                  // un filtro o Ordenar abierto
  if(!$('#sug').hidden)return;                                                   // sugerencias de Ubicación abiertas
  if($('#dlg').open)return;                                                      // ventana Publicar abierta
  e.preventDefault();
  const el=document.documentElement;
  if(document.fullscreenElement)document.exitFullscreen&&document.exitFullscreen();
  else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});
});
</script>
