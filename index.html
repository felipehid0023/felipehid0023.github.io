<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MI POMODORO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍅%3C/text%3E%3C/svg%3E">
<style>
:root{--h:180;--c:hsl(var(--h) 70% 85%);--bg:#0e1014;--card:#171a21;--line:rgba(255,255,255,.1);--dim:color-mix(in srgb,var(--c) 60%,transparent);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--c);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:1120px;margin:0 auto;padding:28px 20px 70px}
h1{font-size:1.15rem;font-weight:600;margin:6px 0 20px;letter-spacing:.05em}
h2{font-size:1rem;margin:0;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;margin-bottom:20px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modes{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.modes button{flex:1;max-width:200px}
button,input,textarea,select{font:inherit;color:inherit}
button{background:transparent;border:1px solid var(--dim);border-radius:12px;padding:10px 18px;cursor:pointer}
button:hover{background:color-mix(in srgb,var(--c) 14%,transparent)}
button.on{background:var(--c);color:#0e1014;border-color:var(--c);font-weight:600}
.time{font-size:clamp(3.5rem,14vw,8rem);font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em;margin:10px 0 2px}
.status{text-align:center;font-size:.9rem;color:var(--dim);margin-bottom:14px;min-height:1.3em}
.bar{height:7px;border-radius:7px;background:var(--line);overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:0;background:var(--c)}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.cfg{display:grid;grid-template-columns:1fr;gap:14px;margin-top:26px}
@media(min-width:900px){.cfg{grid-template-columns:1.7fr 1fr 1fr}}
.c-td .sub+.sub{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.cfg>div{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.cfg span.t{display:block;font-size:.8rem;color:var(--dim);margin-bottom:8px}
.cfg label,.cfg small{font-size:.85rem}
.cfg small{display:block;color:var(--dim);margin-top:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row button{margin-left:6px;padding:8px 16px}
.c-hora .row input[type=number]{width:56px}
.cfg .c-ron{align-items:center;text-align:center;overflow:hidden}
.cfg .c-ron span.t{font-size:clamp(1.2rem,2.4vw,1.8rem);font-weight:700;color:var(--c);margin:0 0 4px}
.cfg .c-ron input[type=number]{width:100%;min-width:0;background:transparent;border:0;padding:0;font-size:clamp(3rem,6vw,4.5rem);font-weight:700;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
input[type=number],select{background:#0e1014;border:1px solid var(--line);border-radius:10px;padding:9px 8px;outline:none}
input[type=number]{width:62px;text-align:center;-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
select{width:100%;margin-top:10px}
input:focus,textarea:focus,select:focus{border-color:var(--c);outline:none}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
li:last-child{border:0}
li input[type=checkbox]{width:24px;height:24px;accent-color:var(--c);flex:none;cursor:pointer}
li input.g{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid transparent;padding:8px 2px;font-size:1.05rem}
li input.g::placeholder{color:var(--dim)}
li input.g:focus{border-bottom-color:var(--c)}
li.done input.g{text-decoration:line-through;opacity:.45}
li button{padding:2px 10px;border-radius:8px}
textarea{width:100%;min-height:180px;resize:vertical;background:#0e1014;border:1px solid var(--line);border-radius:14px;padding:14px;line-height:1.55}
textarea::placeholder{color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center;margin-top:14px}
.stats div{border:1px solid var(--line);border-radius:14px;padding:20px 6px}
.stats b{display:block;font-size:1.8rem}
.stats small{color:var(--dim)}
#pk{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.btns{display:flex;gap:10px}
.btns button{border-radius:50%;width:84px;height:84px;padding:0;background:var(--card);font-size:2.2rem;line-height:1}
#pan,#vp{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
#pan{width:190px}
#vp{width:230px;text-align:center}
#pan.open,#vp.open{display:block}
.vl{font-size:.8rem;color:var(--dim)}
.vn{font-size:2.6rem;font-weight:700;line-height:1.1}
#vol{width:100%;accent-color:var(--c);margin:10px 0}
#vt{width:100%}
@media(max-width:899px){main{padding-top:110px}}
#gm{width:100%;margin-bottom:12px}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw i{aspect-ratio:1;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw i.sel{border-color:#fff}
</style>
</head>
<body>
<div id="pk">
  <div class="btns">
    <button id="sb" aria-label="Sonido">🔊</button>
    <button id="pb" aria-label="Cambiar color">🎨</button>
  </div>
  <div id="vp">
    <div class="vl">Volumen</div>
    <div class="vn" id="vv">5</div>
    <input type="range" id="vol" min="1" max="10" step="1">
    <button id="vt">▶ Probar sonido</button>
  </div>
  <div id="pan">
    <button id="gm">🎮 Modo gamer</button>
    <div class="sw" id="sw"></div>
  </div>
</div>
<main>
  <h1>🍅 MI POMODORO</h1>

  <section class="card">
    <div class="modes">
      <button id="mw" class="on">Trabajo</button>
      <button id="mr">Descanso</button>
    </div>
    <div class="time" id="time">00:50:00</div>
    <div class="status" id="status"></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="ctrl">
      <button id="go" class="on">Iniciar</button>
      <button id="rs">Reiniciar</button>
    </div>

    <div class="cfg">
      <div class="c-hora"><span class="t">Hora de inicio</span>
        <div class="row">
          <input type="number" id="th"> :
          <input type="number" id="tm"> :
          <input type="number" id="ts">
          <button id="em" class="on">Empezar</button>
        </div>
        <select id="tz"></select>
        <small id="clock"></small></div>
      <div class="c-td">
        <div class="sub"><span class="t">Trabajo</span>
          <div class="row"><input type="number" id="wh"> <label>h</label>
          <input type="number" id="wm"> <label>min</label></div></div>
        <div class="sub"><span class="t">Descanso</span>
          <div class="row"><input type="number" id="rh"> <label>h</label>
          <input type="number" id="rm"> <label>min</label></div></div>
      </div>
      <div class="c-ron"><span class="t">Rondas</span>
        <input type="number" id="rd"></div>
    </div>
  </section>

  <section class="card">
    <div class="head"><h2>Metas</h2><button id="na">+ Añadir</button></div>
    <ul id="list"></ul>
  </section>

  <section class="card">
    <div class="head"><h2>Mis notas</h2></div>
    <textarea id="notes" placeholder="Escribe tus notas aquí…"></textarea>
  </section>

  <section class="card">
    <div class="head"><h2>Base de datos</h2></div>
    <div class="stats">
      <div><b id="s1">0 min</b><small>Tiempo total</small></div>
      <div><b id="s2">0/0</b><small>Metas cumplidas</small></div>
      <div><b id="s3">0%</b><small>Cumplimiento</small></div>
    </div>
    <div class="ctrl" style="margin-top:16px"><button id="cl">Reiniciar tiempo total</button></div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const TZ=[['America/Lima','Perú (Lima)'],['America/Bogota','Colombia'],['America/Mexico_City','México'],
['America/Argentina/Buenos_Aires','Argentina'],['America/Santiago','Chile'],['America/New_York','EE. UU. (Este)'],
['America/Los_Angeles','EE. UU. (Pacífico)'],['Europe/Madrid','España'],['UTC','UTC']];
const pad=n=>String(n).padStart(2,'0');
function nowIn(tz){
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const g=t=>+p.find(x=>x.type===t).value;
  return [g('hour'),g('minute'),g('second')];
}
/* Color por defecto: cian pastel (matiz 180, luminosidad 85%) */
const def={hue:180,gamer:false,wh:0,wm:50,rh:0,rm:10,rounds:1,tz:'America/Lima',th:null,tm:0,ts:0};
const old=Object.assign({},store.get('pomo2',{}),store.get('pomo3',{}));
delete old.rounds;delete old.sync;
let st=Object.assign({},def,old,store.get('pomo4',{}));
function nextHour(){st.th=(nowIn(st.tz)[0]+1)%24;st.tm=0;st.ts=0}
nextHour();
st.th=Math.min(23,st.th);st.wh=Math.min(23,st.wh);st.rh=Math.min(23,st.rh);
st.rounds=Math.max(1,Math.min(100,st.rounds||1));
st.vol=Math.max(1,Math.min(10,Math.round(st.vol||5)));
let goals=store.get('goals2',[{text:'',done:false}]);
if(!goals.length)goals=[{text:'',done:false}];
let tot=store.get('tot2',0);
$('notes').value=store.get('notes2','');
let userEdited=false,mode='w',running=false,waiting=false,end=0,waitEnd=0,left=0,tick=null,gt=null,lastT=0,round=1,msg='';
function save(){store.set('pomo4',st)}

/* ---------- Colores (0, 45, 90 … 315) ---------- */
const hues=[0,45,90,135,315,270,225,180];
const sw=$('sw');
hues.forEach(h=>{const i=document.createElement('i');i.style.background=`hsl(${h} 70% 85%)`;i.dataset.h=h;
  i.onclick=()=>{st.gamer=false;st.hue=h;applyColor();save()};sw.appendChild(i)});
function applyColor(){
  document.documentElement.style.setProperty('--h',st.hue);
  [...sw.children].forEach(i=>i.classList.toggle('sel',!st.gamer&&+i.dataset.h===st.hue));
  $('gm').classList.toggle('on',st.gamer);
  clearInterval(gt);
  if(st.gamer)gt=setInterval(()=>{st.hue=(st.hue+1)%360;document.documentElement.style.setProperty('--h',st.hue)},60);
}
$('gm').onclick=()=>{st.gamer=!st.gamer;applyColor();save()};
$('pb').onclick=()=>{$('vp').classList.remove('open');$('pan').classList.toggle('open')};
$('sb').onclick=()=>{$('pan').classList.remove('open');$('vp').classList.toggle('open')};
$('vol').value=st.vol;$('vv').textContent=st.vol;
$('vol').oninput=()=>{st.vol=+$('vol').value;$('vv').textContent=st.vol;save()};
$('vt').onclick=()=>beep();

/* ---------- Utilidades de tiempo ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v||0));
function total(m){return m==='w'?(st.wh*60+st.wm)*60:(st.rh*60+st.rm)*60}
function fmt(s){s=Math.max(0,Math.ceil(s));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(pad).join(':')}
function fmtMin(s){const m=Math.floor(s/60);return m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min'}
function tzName(){return (TZ.find(t=>t[0]===st.tz)||[0,st.tz])[1]}
function targetHMS(){return pad(st.th)+':'+pad(st.tm)+':'+pad(st.ts)}
function secsUntil(){
  const [h,m,s]=nowIn(st.tz);
  let d=(st.th*3600+st.tm*60+st.ts)-(h*3600+m*60+s);
  if(d<0)d+=86400;
  return d-(Date.now()%1000)/1000;
}

/* ---------- Temporizador ---------- */
function status(){
  let t;
  if(waiting)t=`Esperando las ${targetHMS()} (${tzName()}) para iniciar solo`;
  else if(msg)t=msg;
  else t=`Ronda ${round} / ${st.rounds} · ${mode==='w'?'Trabajo':'Descanso'}`;
  $('status').textContent=t;
}
function draw(){
  if(waiting){$('time').textContent=fmt((waitEnd-Date.now())/1000);$('bar').style.width='0'}
  else{const t=total(mode)||1;$('time').textContent=fmt(left);$('bar').style.width=(100-left/t*100)+'%'}
  status();
  document.title=((running||waiting)?fmt(waiting?(waitEnd-Date.now())/1000:left)+' · ':'')+'MI POMODORO';
}
function setMode(m){
  mode=m;$('mw').classList.toggle('on',m==='w');$('mr').classList.toggle('on',m==='r');
  left=total(m);if(running)end=Date.now()+left*1000;draw();
}
/* Sonido de temporizador: 3 ráfagas de 4 pitidos cortos */
function beep(){
  try{
    const a=new (window.AudioContext||window.webkitAudioContext)();
    const master=a.createGain();master.gain.value=st.vol*0.04;master.connect(a.destination);
    for(let b=0;b<3;b++)for(let i=0;i<4;i++){
      const t=a.currentTime+b*0.9+i*0.14;
      const o=a.createOscillator(),g=a.createGain();
      o.type='square';o.frequency.value=2000;o.connect(g);g.connect(master);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(1,t+0.005);
      g.gain.setValueAtTime(1,t+0.06);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.078);
      o.start(t);o.stop(t+0.08);
    }
    setTimeout(()=>a.close(),3500);
  }catch(e){}
}
function account(){
  const now=Date.now();
  tot+=(now-lastT)/1000;store.set('tot2',tot);stats();
  lastT=now;
}
function finish(){
  running=false;clearInterval(tick);round=1;$('go').textContent='Iniciar';
  setMode('w');msg='¡Completaste todas las rondas! 🎉';draw();
}
function loop(){
  if(waiting){
    if(waitEnd-Date.now()<=0){userEdited=false;begin()}else draw();
    return;
  }
  account();
  left=(end-Date.now())/1000;
  if(left<=0){
    beep();
    if(mode==='w')setMode('r');
    else{round++;if(round>st.rounds){finish();return}setMode('w')}
  }
  draw();
}
function begin(){
  waiting=false;$('em').textContent='Empezar';
  msg='';running=true;end=Date.now()+left*1000;lastT=Date.now();
  $('go').textContent='Pausa';clearInterval(tick);tick=setInterval(loop,250);loop();
}
function cancelWait(){waiting=false;clearInterval(tick);$('em').textContent='Empezar'}
/* Iniciar: arranca libremente, ahora mismo */
function start(){
  if(total(mode)<=0)return;
  if(waiting)cancelWait();
  begin();
}
/* Empezar: espera a la hora indicada y luego inicia el pomodoro desde cero */
function schedule(){
  if(waiting){cancelWait();draw();return}
  if(total('w')<=0)return;
  pause();round=1;msg='';setMode('w');
  const rem=secsUntil();
  if(rem<=0){begin();return}
  waiting=true;waitEnd=Date.now()+rem*1000;$('em').textContent='Cancelar';
  clearInterval(tick);tick=setInterval(loop,250);draw();
}
function pause(){
  if(waiting){cancelWait();draw();return}
  if(running){account();left=Math.max(0,(end-Date.now())/1000)}
  running=false;clearInterval(tick);$('go').textContent='Iniciar';draw();
}
$('go').onclick=()=>running?pause():start();
$('em').onclick=schedule;
$('rs').onclick=()=>{pause();round=1;msg='';setMode('w')};
$('mw').onclick=()=>{pause();msg='';setMode('w')};
$('mr').onclick=()=>{pause();msg='';setMode('r')};

/* ---------- Opciones ---------- */
TZ.forEach(([v,n])=>{const o=document.createElement('option');o.value=v;o.textContent=n;$('tz').appendChild(o)});
$('tz').value=st.tz;
$('tz').onchange=()=>{st.tz=$('tz').value;save();clock();draw()};
[['wh','wh',0,23],['wm','wm',0,59],['rh','rh',0,23],['rm','rm',0,59],
 ['th','th',0,23],['tm','tm',0,59],['ts','ts',0,59],['rd','rounds',1,100]].forEach(([id,k,a,b])=>{
  const el=$(id);el.value=st[k];el.min=a;el.max=b;el.inputMode='numeric';
  el.onkeydown=e=>{if(['e','E','+','-','.',',','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault()};
  el.addEventListener('wheel',e=>e.preventDefault(),{passive:false});
  el.oninput=()=>{if(el.value!==''&&+el.value>b)el.value=b};
  el.onchange=()=>{if(['th','tm','ts'].includes(id))userEdited=true;st[k]=clamp(parseInt(el.value),a,b);el.value=st[k];save();
    if(!running&&!waiting){left=total(mode)}draw()}
});
function clock(){
  const [h,m,s]=nowIn(st.tz);
  $('clock').textContent=`Hora ahora en ${tzName()}: ${pad(h)}:${pad(m)}:${pad(s)}`;
  if(!userEdited&&!waiting){
    const nh=(h+1)%24;
    if(st.th!==nh||st.tm||st.ts){st.th=nh;st.tm=0;st.ts=0;$('th').value=nh;$('tm').value=0;$('ts').value=0}
  }
}
setInterval(clock,1000);

/* ---------- Metas ---------- */
function saveGoals(){store.set('goals2',goals)}
function stats(){
  const filled=goals.filter(g=>g.text.trim());
  const done=filled.filter(g=>g.done).length;
  $('s1').textContent=fmtMin(tot);
  $('s2').textContent=done+'/'+filled.length;
  $('s3').textContent=(filled.length?Math.round(done/filled.length*100):0)+'%';
}
function renderGoals(focusLast){
  const ul=$('list');ul.innerHTML='';
  goals.forEach((g,i)=>{
    const li=document.createElement('li');if(g.done)li.className='done';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=g.done;
    const tx=document.createElement('input');tx.type='text';tx.className='g';tx.maxLength=120;
    tx.placeholder='Escribe una meta…';tx.value=g.text;
    cb.onchange=()=>{
      if(!g.text.trim()){cb.checked=false;tx.focus();return}
      g.done=cb.checked;li.classList.toggle('done',g.done);saveGoals();stats();
    };
    tx.oninput=()=>{g.text=tx.value;if(!g.text.trim()&&g.done){g.done=false;cb.checked=false;li.classList.remove('done')}saveGoals();stats()};
    tx.onkeydown=e=>{if(e.key==='Enter'){goals.push({text:'',done:false});saveGoals();renderGoals(true)}};
    const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label','Eliminar meta');
    x.onclick=()=>{goals.splice(i,1);if(!goals.length)goals.push({text:'',done:false});saveGoals();renderGoals()};
    li.append(cb,tx,x);ul.appendChild(li);
  });
  stats();
  if(focusLast){const all=ul.querySelectorAll('input.g');all[all.length-1].focus()}
}
$('na').onclick=()=>{goals.push({text:'',done:false});saveGoals();renderGoals(true)};

/* ---------- Notas y datos ---------- */
$('notes').oninput=e=>store.set('notes2',e.target.value);
$('cl').onclick=()=>{if(confirm('¿Reiniciar el tiempo total a 0?')){tot=0;store.set('tot2',0);stats()}};

/* ---------- Inicio ---------- */
applyColor();clock();left=total('w');draw();renderGoals();
</script>
</body>
</html>
