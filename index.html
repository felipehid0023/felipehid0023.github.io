<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Pomodoro</title>
<style>
:root{--h:180;--c:hsl(var(--h) 70% 85%);--bg:#0e1014;--card:#171a21;--line:rgba(255,255,255,.1);--dim:color-mix(in srgb,var(--c) 60%,transparent);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--c);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:1.1rem;font-weight:600;margin:6px 0 18px;letter-spacing:.04em}
h2{font-size:.95rem;margin:0;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.modes{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.modes button{flex:1;max-width:160px}
button,input,textarea,select{font:inherit;color:inherit}
button{background:transparent;border:1px solid var(--dim);border-radius:12px;padding:9px 14px;cursor:pointer}
button:hover{background:color-mix(in srgb,var(--c) 14%,transparent)}
button.on{background:var(--c);color:#0e1014;border-color:var(--c);font-weight:600}
.time{font-size:clamp(3rem,16vw,5.5rem);font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em;margin:8px 0 2px}
.status{text-align:center;font-size:.85rem;color:var(--dim);margin-bottom:12px;min-height:1.2em}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--c)}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid var(--dim);border-radius:12px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:9px 12px}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:20px}
.cfg>div{border:1px solid var(--line);border-radius:12px;padding:10px}
.cfg span.t{display:block;font-size:.8rem;color:var(--dim);margin-bottom:6px}
.cfg label,.cfg small{font-size:.85rem}
.cfg small{display:block;color:var(--dim);margin-top:8px}
input[type=number],select{background:#0e1014;border:1px solid var(--line);border-radius:8px;padding:7px 8px;outline:none}
input[type=number]{width:56px}
select{width:100%;margin-top:8px}
input:focus,textarea:focus,select:focus{border-color:var(--c);outline:none}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
li:last-child{border:0}
li input[type=checkbox]{width:22px;height:22px;accent-color:var(--c);flex:none;cursor:pointer}
li input.g{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid transparent;padding:6px 2px}
li input.g::placeholder{color:var(--dim)}
li input.g:focus{border-bottom-color:var(--c)}
li.done input.g{text-decoration:line-through;opacity:.45}
li button{padding:2px 9px;border-radius:8px}
textarea{width:100%;min-height:140px;resize:vertical;background:#0e1014;border:1px solid var(--line);border-radius:12px;padding:12px;line-height:1.5}
textarea::placeholder{color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-top:12px}
.stats div{border:1px solid var(--line);border-radius:12px;padding:14px 4px}
.stats b{display:block;font-size:1.35rem}
.stats small{color:var(--dim)}
#pk{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;text-align:right}
#pk>button{border-radius:50%;width:42px;height:42px;padding:0;background:var(--card);font-size:1.1rem}
#pan{display:none;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;width:190px}
#pan.open{display:block}
#gm{width:100%;margin-bottom:12px}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw i{aspect-ratio:1;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw i.sel{border-color:#fff}
</style>
</head>
<body>
<div id="pk">
  <button id="pb" aria-label="Cambiar color">🎨</button>
  <div id="pan">
    <button id="gm">🎮 Modo gamer</button>
    <div class="sw" id="sw"></div>
  </div>
</div>
<main>
  <h1>🍅 MI POMODORO</h1>

  <section class="card">
    <div class="modes">
      <button id="mw" class="on">Trabajo</button>
      <button id="mr">Descanso</button>
    </div>
    <div class="time" id="time">00:50:00</div>
    <div class="status" id="status"></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="ctrl">
      <button id="go" class="on">Iniciar</button>
      <div class="seg">
        <button id="t0" title="Inicia ahora mismo">Libre</button>
        <button id="t1" title="Espera a la hora indicada y luego inicia solo">A la hora</button>
      </div>
      <button id="rs">Reiniciar</button>
    </div>

    <div class="cfg">
      <div><span class="t">Trabajo</span>
        <input type="number" id="wh" min="0" max="12"> <label>h</label>
        <input type="number" id="wm" min="0" max="59"> <label>min</label></div>
      <div><span class="t">Descanso</span>
        <input type="number" id="rh" min="0" max="12"> <label>h</label>
        <input type="number" id="rm" min="0" max="59"> <label>min</label></div>
      <div><span class="t">Hora de inicio (0–24 : 0–59 : 0–59)</span>
        <input type="number" id="th" min="0" max="24"> :
        <input type="number" id="tm" min="0" max="59"> :
        <input type="number" id="ts" min="0" max="59">
        <select id="tz"></select>
        <small id="clock"></small></div>
      <div><span class="t">Rondas (trabajo + descanso)</span>
        <input type="number" id="rd" min="0" max="99"> <label>veces</label>
        <small>0 = sin límite</small></div>
    </div>
  </section>

  <section class="card">
    <div class="head"><h2>Metas</h2><button id="na">+ Añadir</button></div>
    <ul id="list"></ul>
  </section>

  <section class="card">
    <div class="head"><h2>Mis notas</h2></div>
    <textarea id="notes" placeholder="Escribe tus notas aquí…"></textarea>
  </section>

  <section class="card">
    <div class="head"><h2>Base de datos</h2></div>
    <div class="stats">
      <div><b id="s1">0 min</b><small>Tiempo total</small></div>
      <div><b id="s2">0/0</b><small>Metas cumplidas</small></div>
      <div><b id="s3">0%</b><small>Cumplimiento</small></div>
    </div>
    <div class="ctrl" style="margin-top:14px"><button id="cl">Reiniciar tiempo total</button></div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const TZ=[['America/Lima','Perú (Lima)'],['America/Bogota','Colombia'],['America/Mexico_City','México'],
['America/Argentina/Buenos_Aires','Argentina'],['America/Santiago','Chile'],['America/New_York','EE. UU. (Este)'],
['America/Los_Angeles','EE. UU. (Pacífico)'],['Europe/Madrid','España'],['UTC','UTC']];
const pad=n=>String(n).padStart(2,'0');
function nowIn(tz){
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const g=t=>+p.find(x=>x.type===t).value;
  return [g('hour'),g('minute'),g('second')];
}
const def={hue:180,gamer:false,wh:0,wm:50,rh:0,rm:10,rounds:4,sync:false,tz:'America/Lima',th:null,tm:0,ts:0};
let st=Object.assign({},def,store.get('pomo2',{}),store.get('pomo3',{}));
if(st.th===null)st.th=(nowIn(st.tz)[0]+1)%24;
let goals=store.get('goals2',[{text:'',done:false}]);
if(!goals.length)goals=[{text:'',done:false}];
let tot=store.get('tot2',0);
$('notes').value=store.get('notes2','');
let mode='w',running=false,waiting=false,end=0,waitEnd=0,left=0,tick=null,gt=null,lastT=0,round=1,msg='';
function save(){store.set('pomo3',st)}

/* ---------- Colores (0, 45, 90 … 315) ---------- */
const hues=[0,45,90,135,315,270,225,180];
const sw=$('sw');
hues.forEach(h=>{const i=document.createElement('i');i.style.background=`hsl(${h} 70% 85%)`;i.dataset.h=h;
  i.onclick=()=>{st.gamer=false;st.hue=h;applyColor();save()};sw.appendChild(i)});
function applyColor(){
  document.documentElement.style.setProperty('--h',st.hue);
  [...sw.children].forEach(i=>i.classList.toggle('sel',!st.gamer&&+i.dataset.h===st.hue));
  $('gm').classList.toggle('on',st.gamer);
  clearInterval(gt);
  if(st.gamer)gt=setInterval(()=>{st.hue=(st.hue+1)%360;document.documentElement.style.setProperty('--h',st.hue)},60);
}
$('gm').onclick=()=>{st.gamer=!st.gamer;applyColor();save()};
$('pb').onclick=()=>$('pan').classList.toggle('open');

/* ---------- Utilidades de tiempo ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v||0));
function total(m){return m==='w'?(st.wh*60+st.wm)*60:(st.rh*60+st.rm)*60}
function fmt(s){s=Math.max(0,Math.ceil(s));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(pad).join(':')}
function fmtMin(s){const m=Math.floor(s/60);return m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min'}
function tzName(){return (TZ.find(t=>t[0]===st.tz)||[0,st.tz])[1]}
function targetHMS(){return pad(st.th%24)+':'+pad(st.tm)+':'+pad(st.ts)}
function secsUntil(){
  const [h,m,s]=nowIn(st.tz);
  let d=((st.th%24)*3600+st.tm*60+st.ts)-(h*3600+m*60+s);
  if(d<0)d+=86400;
  return d-(Date.now()%1000)/1000;
}

/* ---------- Temporizador ---------- */
function status(){
  let t;
  if(waiting)t=`Esperando las ${targetHMS()} (${tzName()}) para iniciar solo`;
  else if(msg)t=msg;
  else t=`Ronda ${round}${st.rounds>0?' / '+st.rounds:''} · ${mode==='w'?'Trabajo':'Descanso'}`;
  $('status').textContent=t;
}
function draw(){
  if(waiting){$('time').textContent=fmt((waitEnd-Date.now())/1000);$('bar').style.width='0'}
  else{const t=total(mode)||1;$('time').textContent=fmt(left);$('bar').style.width=(100-left/t*100)+'%'}
  status();
  document.title=((running||waiting)?fmt(waiting?(waitEnd-Date.now())/1000:left)+' · ':'')+'Mi Pomodoro';
}
function setMode(m){
  mode=m;$('mw').classList.toggle('on',m==='w');$('mr').classList.toggle('on',m==='r');
  left=total(m);if(running)end=Date.now()+left*1000;draw();
}
function beep(){
  try{const a=new (window.AudioContext||window.webkitAudioContext)();
    [0,.25,.5].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=660;
      o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.15,a.currentTime+d);
      g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d+.2);o.start(a.currentTime+d);o.stop(a.currentTime+d+.22)})}catch(e){}
}
function account(){
  const now=Date.now();
  tot+=(now-lastT)/1000;store.set('tot2',tot);stats();
  lastT=now;
}
function finish(){
  running=false;clearInterval(tick);round=1;$('go').textContent='Iniciar';
  setMode('w');msg='¡Completaste todas las rondas! 🎉';draw();
}
function loop(){
  if(waiting){
    if(waitEnd-Date.now()<=0){waiting=false;begin()}else draw();
    return;
  }
  account();
  left=(end-Date.now())/1000;
  if(left<=0){
    beep();
    if(mode==='w')setMode('r');
    else{round++;if(st.rounds>0&&round>st.rounds){finish();return}setMode('w')}
  }
  draw();
}
function begin(){
  msg='';running=true;end=Date.now()+left*1000;lastT=Date.now();
  $('go').textContent='Pausa';clearInterval(tick);tick=setInterval(loop,250);loop();
}
function start(){
  if(total(mode)<=0)return;
  const fresh=mode==='w'&&round===1&&left>=total('w')-1;
  if(st.sync&&fresh){
    const rem=secsUntil();
    if(rem>0){
      msg='';waiting=true;waitEnd=Date.now()+rem*1000;
      $('go').textContent='Cancelar';clearInterval(tick);tick=setInterval(loop,250);draw();return;
    }
  }
  begin();
}
function pause(){
  if(waiting){waiting=false;clearInterval(tick);$('go').textContent='Iniciar';draw();return}
  if(running){account();left=Math.max(0,(end-Date.now())/1000)}
  running=false;clearInterval(tick);$('go').textContent='Iniciar';draw();
}
$('go').onclick=()=>(running||waiting)?pause():start();
$('rs').onclick=()=>{pause();round=1;msg='';setMode('w')};
$('mw').onclick=()=>{pause();msg='';setMode('w')};
$('mr').onclick=()=>{pause();msg='';setMode('r')};

/* ---------- Opciones ---------- */
TZ.forEach(([v,n])=>{const o=document.createElement('option');o.value=v;o.textContent=n;$('tz').appendChild(o)});
$('tz').value=st.tz;
$('tz').onchange=()=>{st.tz=$('tz').value;save();clock();draw()};
[['wh','wh',0,12],['wm','wm',0,59],['rh','rh',0,12],['rm','rm',0,59],
 ['th','th',0,24],['tm','tm',0,59],['ts','ts',0,59],['rd','rounds',0,99]].forEach(([id,k,a,b])=>{
  const el=$(id);el.value=st[k];
  el.onchange=()=>{st[k]=clamp(parseInt(el.value),a,b);el.value=st[k];save();
    if(!running&&!waiting){left=total(mode)}draw()}
});
function setSync(v){st.sync=v;$('t0').classList.toggle('on',!v);$('t1').classList.toggle('on',v);save()}
$('t0').onclick=()=>setSync(false);
$('t1').onclick=()=>setSync(true);
function clock(){const [h,m,s]=nowIn(st.tz);$('clock').textContent=`Hora ahora en ${tzName()}: ${pad(h)}:${pad(m)}:${pad(s)}`}
setInterval(clock,1000);

/* ---------- Metas ---------- */
function saveGoals(){store.set('goals2',goals)}
function stats(){
  const filled=goals.filter(g=>g.text.trim());
  const done=filled.filter(g=>g.done).length;
  $('s1').textContent=fmtMin(tot);
  $('s2').textContent=done+'/'+filled.length;
  $('s3').textContent=(filled.length?Math.round(done/filled.length*100):0)+'%';
}
function renderGoals(focusLast){
  const ul=$('list');ul.innerHTML='';
  goals.forEach((g,i)=>{
    const li=document.createElement('li');if(g.done)li.className='done';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=g.done;
    const tx=document.createElement('input');tx.type='text';tx.className='g';tx.maxLength=120;
    tx.placeholder='Escribe una meta…';tx.value=g.text;
    cb.onchange=()=>{
      if(!g.text.trim()){cb.checked=false;tx.focus();return}
      g.done=cb.checked;li.classList.toggle('done',g.done);saveGoals();stats();
    };
    tx.oninput=()=>{g.text=tx.value;if(!g.text.trim()&&g.done){g.done=false;cb.checked=false;li.classList.remove('done')}saveGoals();stats()};
    tx.onkeydown=e=>{if(e.key==='Enter'){goals.push({text:'',done:false});saveGoals();renderGoals(true)}};
    const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label','Eliminar meta');
    x.onclick=()=>{goals.splice(i,1);if(!goals.length)goals.push({text:'',done:false});saveGoals();renderGoals()};
    li.append(cb,tx,x);ul.appendChild(li);
  });
  stats();
  if(focusLast){const all=ul.querySelectorAll('input.g');all[all.length-1].focus()}
}
$('na').onclick=()=>{goals.push({text:'',done:false});saveGoals();renderGoals(true)};

/* ---------- Notas y datos ---------- */
$('notes').oninput=e=>store.set('notes2',e.target.value);
$('cl').onclick=()=>{if(confirm('¿Reiniciar el tiempo total a 0?')){tot=0;store.set('tot2',0);stats()}};

/* ---------- Inicio ---------- */
setSync(st.sync);applyColor();clock();left=total('w');draw();renderGoals();
</script>
</body>
</html>
